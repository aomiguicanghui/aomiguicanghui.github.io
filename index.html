<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="assets/app.css">

<body>
<header id="topbar">
  <button id="menuBtn" aria-label="菜单" title="目录">☰</button>
  <a class="brand" href="#topics/%E5%89%8D%E5%BA%8F.htm">ADND2E扩展不全书</a>
  <div id="searchBox">
    <input id="searchInput" type="search" placeholder="搜索法术、规则、术语…" autocomplete="off">
    <label id="titleOnlyWrap"><input type="checkbox" id="titleOnly"> 仅搜标题</label>
  </div>
  <button id="chargenBtn" type="button" title="角色创建向导（车卡）" aria-label="角色创建向导">🎲 车卡</button>
  <div id="themeWrap">
    <button id="themeBtn" type="button" aria-label="切换主题" title="切换主题">
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path d="M10 2a4 4 0 0 0-4 4c0 1.2.5 2.2 1.4 3l.5.6c.6.7.9 1.5.9 2.4a1 1 0 0 0 2 0c0-.9.3-1.7.9-2.4l.5-.6C13.5 8.2 14 7.2 14 6a4 4 0 0 0-4-4Zm0 9.6c.6-1 1.4-2.2 1.4-3.6a1.4 1.4 0 0 0-2.8 0c0 1.4.8 2.6 1.4 3.6ZM10 18a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/>
      </svg>
    </button>
    <div id="themeMenu" hidden>
      <div id="themeMenuTitle">选择主题</div>
      <button class="theme-opt" data-key="parchment" type="button"><span class="sw"></span>羊皮纸</button>
      <button class="theme-opt" data-key="elven" type="button"><span class="sw"></span>翠林秘境</button>
      <button class="theme-opt" data-key="arcane" type="button"><span class="sw"></span>秘蓝法阵</button>
      <button class="theme-opt" data-key="dungeon" type="button"><span class="sw"></span>黑曜地城</button>
      <button class="theme-opt" data-key="dragon" type="button"><span class="sw"></span>龙血灰烬</button>
    </div>
  </div>
</header>

<div id="searchResults" hidden>
  <div id="searchResultsHead">结果 (<span id="searchResultsCount">0</span>) — <span id="searchResultsTime"></span></div>
  <ol id="searchResultsList"></ol>
</div>

<div id="layout">
  <aside id="sidebar">
    <div id="tocTree" role="tree">加载目录…</div>
  </aside>
  <main id="content">
    <article id="article"></article>
  </main>
</div>

<footer id="altFooter" hidden></footer>
<div id="overlay" hidden></div>

<div id="chargenView" hidden>
  <header id="chargenTop">
    <div class="cg-top-left">
      <button id="chargenBack" type="button" title="返回阅读">←　返回</button>
      <span class="cg-brand">角色创建向导</span>
    </div>
    <div class="cg-top-right">
      <span id="cgStepLabel"></span>
      <button id="cgSave" type="button" title="保存">💾 保存</button>
      <button id="cgPrint" type="button" title="打印角色卡">🖨 打印</button>
    </div>
  </header>
  <div id="chargenBody"></div>
</div>

<script src="assets/chargen-data.js"></script>
<script src="assets/chargen.js"></script>
<script src="assets/app.js"></script>
